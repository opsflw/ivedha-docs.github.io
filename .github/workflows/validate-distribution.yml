name: validate-distribution

on:
  pull_request:
  push:
    branches: [gh-pages]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out distribution
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate site paths and catalog
        run: python scripts/validate_distribution.py
